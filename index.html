<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tilawa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&family=Manrope:wght@400;600;800&display=swap">
<style>
/* Mise en page : une feuille de mushaf encadrée, barre d'outils en haut, dock micro en bas. */
:root{
  --bg:#EDF0F6; --paper:#FDFCF9; --surface:#FFFFFF; --ink:#16213A; --muted:#5A667C; --line:#D5DCE8;
  --accent:#23459B; --on-accent:#FFFFFF; --brass:#946510; --brass-soft:rgba(148,101,16,.14); --brass-line:rgba(148,101,16,.45);
  --ok:#13794B; --approx:#A86A00; --bad:#C23333; --skip:#6F7B90;
  --ar:'Amiri Quran','Scheherazade New','Noto Naskh Arabic',serif;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A111F; --paper:#101A2E; --surface:#14203A; --ink:#E8EDF6; --muted:#9BA8BF; --line:#25314B;
  --accent:#8AA6FF; --on-accent:#0B1322; --brass:#E2B964; --brass-soft:rgba(226,185,100,.16); --brass-line:rgba(226,185,100,.4);
  --ok:#3DD598; --approx:#F2B34A; --bad:#FF7070; --skip:#8B97AD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111F; --paper:#101A2E; --surface:#14203A; --ink:#E8EDF6; --muted:#9BA8BF; --line:#25314B;
  --accent:#8AA6FF; --on-accent:#0B1322; --brass:#E2B964; --brass-soft:rgba(226,185,100,.16); --brass-line:rgba(226,185,100,.4);
  --ok:#3DD598; --approx:#F2B34A; --bad:#FF7070; --skip:#8B97AD; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);min-height:100vh;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.brand b{font-size:1.1rem;letter-spacing:.03em}
.brand span{font-family:var(--ar);font-size:1.35rem;color:var(--brass)}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav select,.nav input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.nav select{flex:1 1 170px}
.nav input[type=number]{width:74px;text-align:center}
.ib{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700}
.tabs{display:flex;gap:4px;margin-top:6px}
.tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 4px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
main{padding-top:14px}
.view{display:none}.view.on{display:block}

/* feuille de mushaf */
#sheet{--fs:26px;background:var(--paper);border:1px solid var(--brass);border-radius:6px;
  box-shadow:inset 0 0 0 5px var(--paper),inset 0 0 0 6px var(--brass-line),0 8px 26px rgba(10,20,40,.10);
  padding:20px 16px 12px;margin:2px 0 0}
.shead{display:flex;justify-content:space-between;direction:rtl;font-family:var(--ar);color:var(--brass);font-size:1.05rem;padding:0 2px 8px;border-bottom:1px solid var(--brass-line);margin-bottom:6px}
#lines{direction:rtl}
.ln{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:baseline;white-space:nowrap;
  font-family:var(--ar);font-size:var(--fs);line-height:2.15}
.ln.short{justify-content:center;gap:0 .5em}
#lines.flow{display:block;text-align:justify;text-align-last:start;font-family:var(--ar);font-size:var(--fs);line-height:2.35}
#lines.flow .ln{display:contents;white-space:normal}
.w{padding:0 .08em;border-radius:.35em;cursor:pointer;transition:background .15s,color .15s}
.w:hover{background:var(--brass-soft)}
.w.ok{color:var(--ok)}
.w.approx{color:var(--approx)}
.w.bad{color:var(--bad);text-decoration:underline wavy;text-underline-offset:.28em}
.w.skip{color:var(--skip);text-decoration:underline dotted;text-underline-offset:.28em}
.w.na{opacity:.5}
.w.cur{background:var(--brass-soft);box-shadow:0 2px 0 var(--brass)}
.w.hid{color:transparent;background:var(--line);user-select:none}
.w.pl{background:var(--brass-soft)}
.end{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border:1px solid var(--brass);border-radius:50%;
  color:var(--brass);font-size:.6em;line-height:1;margin:0 .3em;padding:0 .2em;cursor:pointer;vertical-align:middle}
.mk{color:var(--brass);font-size:.8em;padding:0 .1em}
.sura{display:flex;align-items:center;justify-content:center;gap:.7em;margin:.45em 0;padding:.05em .6em;
  border-block:1px solid var(--brass);background:linear-gradient(90deg,transparent,var(--brass-soft),transparent);
  font-family:var(--ar);font-size:calc(var(--fs) * 1.05);color:var(--brass);white-space:nowrap;line-height:1.9}
.sura::before,.sura::after{content:"";width:.38em;height:.38em;background:var(--brass);transform:rotate(45deg);flex:none}
.bism{text-align:center;font-family:var(--ar);font-size:var(--fs);line-height:2.1}
.pgno{display:grid;place-items:center;margin:8px auto 0;width:2.4em;height:2.4em;border:1px solid var(--brass);border-radius:50%;
  font-family:var(--ar);color:var(--brass);font-size:1rem;direction:rtl}
#heard{min-height:1.6em;margin:10px 4px 0;font-family:var(--ar);direction:rtl;color:var(--muted);font-size:1.15rem;text-align:center}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin:10px 4px 0;font-size:.85rem;color:var(--muted)}
.stat b{color:var(--ink)}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:.35em}

/* dock micro */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(14px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
.dock .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
#mic{flex:none;width:68px;height:68px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#mic svg{width:30px;height:30px}
#mic.live{background:var(--bad);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,51,51,.5)}100%{box-shadow:0 0 0 18px rgba(194,51,51,0)}}
@media (prefers-reduced-motion:reduce){#mic.live{animation:none}.w{transition:none}}
#msg{flex:1;min-width:0}
#msgMain{font-size:.92rem;color:var(--muted)}
#msgMain b{color:var(--ink)}
#diag{font-size:.78rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.dock .ib{flex:none}
#dbg{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--accent);margin-top:5px}
#mic.live.lvl{animation:none;box-shadow:0 0 0 calc(var(--lvl,0) * 20px) rgba(194,51,51,.35),0 4px 14px rgba(0,0,0,.25)}
dialog p{margin:.4em 0}

/* cartes et formulaires */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 8px;font-size:1rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row label{flex:1 1 150px;color:var(--muted)}
.row select,.row input[type=text],.row input[type=password]{flex:1 1 180px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.warn{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.ar{font-family:var(--ar);font-size:1.3rem;direction:rtl}
progress{width:100%;height:10px;accent-color:var(--accent)}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:min(92vw,460px);width:100%;padding:16px}
dialog::backdrop{background:rgba(5,10,20,.55)}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px}
.lock form{width:min(92vw,320px);display:grid;gap:12px;text-align:center}
.lock input{text-align:center;font-size:1.4rem;letter-spacing:.4em;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.err{color:var(--bad)}
.ok-t{color:var(--ok)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:40;max-width:90vw}
</style>
</head>
<body>

<div class="lock" id="lock" hidden>
  <form id="lockForm">
    <div class="ar" style="text-align:center;color:var(--brass);font-size:2rem">تلاوة</div>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="Code">
    <button class="btn" type="submit">Ouvrir</button>
    <div class="err small" id="lockErr"></div>
  </form>
</div>

<div class="wrap">
<header class="top">
  <div class="brand"><b>Tilawa</b><span>تلاوة</span></div>
  <div class="nav">
    <select id="selSura" aria-label="Sourate"></select>
    <button class="ib" id="prev" aria-label="Page précédente">‹</button>
    <input id="pageIn" type="number" min="1" max="604" aria-label="Numéro de page">
    <button class="ib" id="next" aria-label="Page suivante">›</button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" data-v="read" aria-selected="true">Lire</button>
    <button role="tab" data-v="prog" aria-selected="false">Progrès</button>
    <button role="tab" data-v="set" aria-selected="false">Réglages</button>
  </div>
</header>

<main>
  <section class="view on" id="v-read">
    <div id="sheet">
      <div class="shead"><span id="shSura"></span><span id="shJuz"></span></div>
      <div id="lines" aria-live="off"></div>
      <div class="pgno" id="pgno"></div>
    </div>
    <div id="heard" aria-live="polite"></div>
    <div class="stat" id="stat"></div>
    <div class="stat" id="legend">
      <span><i class="dot" style="background:var(--ok)"></i>correct</span>
      <span><i class="dot" style="background:var(--approx)"></i>à vérifier</span>
      <span><i class="dot" style="background:var(--bad)"></i>erreur</span>
      <span><i class="dot" style="background:var(--skip)"></i>oublié</span>
    </div>
  </section>

  <section class="view" id="v-prog"></section>
  <section class="view" id="v-set"></section>
</main>
</div>

<div class="dock"><div class="in">
  <button id="mic" aria-label="Commencer la récitation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
  </button>
  <div id="msg"><div id="msgMain">Touche le micro et récite, depuis n’importe quel mot de la page.</div><div id="diag"></div><div id="dbg"></div><button type="button" class="chip" id="eng"></button></div>
  <button class="ib" id="playPage" aria-label="Écouter la page">▶︎ Page</button>
</div></div>

<dialog id="wm"></dialog>
<dialog id="sum"></dialog>
<dialog id="dl"></dialog>
<div id="toast" hidden></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('tilawa.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem('tilawa.'+k,JSON.stringify(v))}catch(e){}}};

//<engine>
/* Moteur de comparaison : texte attendu (Uthmani) contre mots entendus. */
const STRIP=/[ؐ-ًؚ-ٰٟۖ-ۭـ​-‏࣓-ࣿ﴾﴿]/g;
function normalize(s){
  return String(s||'').replace(STRIP,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'')
    .replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ک/g,'ك').replace(/[یې]/g,'ي')
    .replace(/[^ء-ؿف-ي]/g,'');
}
function skeleton(n){return n.replace(/[اوي]/g,'')||n}
function lev(a,b){
  if(a===b)return 0; if(!a.length)return b.length; if(!b.length)return a.length;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[b.length];
}
function sim(a,b){const m=Math.max(a.length,b.length);return m?1-lev(a,b)/m:1}
function prep(t){const n=normalize(t);return {n,sk:skeleton(n)}}
function matchWord(e,h,thr){
  if(!e.n||!h.n)return {s:0,k:null};
  if(e.n===h.n)return {s:1,k:'ok'};
  if(e.sk===h.sk&&e.sk.length>=2)return {s:.95,k:'ok'};
  if(Math.max(e.n.length,h.n.length)<=3)return {s:sim(e.n,h.n),k:null};
  const s=Math.max(sim(e.n,h.n),sim(e.sk,h.sk));
  return {s,k:s>=thr?'approx':null};
}
function joined(a,b){const n=a.n+b.n;return {n,sk:skeleton(n)}}
function mark(w,k,raw){w.status=k;w.heard=raw}
/* Trouve où la récitation commence dans la page : deux mots consécutifs identiques (ou un mot long et unique). */
function findStart(exp,from,H,i,thr){
  const h0=H[i],h1=H[i+1];
  let best=-1,bd=1e9,cnt=0;
  for(let j=0;j<exp.length;j++){
    if(matchWord(exp[j],h0,thr).k!=='ok')continue;
    if(h1){if(j+1>=exp.length||!matchWord(exp[j+1],h1,thr).k)continue}
    else if(h0.sk.length<4)continue;
    cnt++;const d=Math.abs(j-from);if(d<bd){bd=d;best=j}
  }
  if(!h1&&cnt!==1)return -1;
  return best;
}
/* Parmi les hypothèses du moteur vocal, garde celle qui colle le mieux aux mots attendus. */
function pickAlt(exp,ses,alts,thr){
  if(alts.length<2)return alts[0]||'';
  let bi=0,bs=-1;
  alts.forEach((a,idx)=>{
    let s=0;
    for(const r of a.split(/\s+/)){
      const h=prep(r);if(!h.n)continue;
      for(let k=0;k<8&&ses.pos+k<exp.length;k++){if(matchWord(exp[ses.pos+k],h,thr).k){s++;break}}
    }
    if(s>bs){bs=s;bi=idx}
  });
  return alts[bi]||'';
}
function feed(exp,ses,heardWords,thr){
  let H=heardWords.map(r=>({raw:r,...prep(r)})).filter(h=>h.n);
  if(ses.pend&&ses.pend.length){H=ses.pend.concat(H);ses.pend=[]}
  let i=0;
  while(i<H.length){
    if(ses.pos>=exp.length){ses.done=true;ses.carry=(ses.carry||[]).concat(H.slice(i).map(h=>h.raw));break}
    if(!ses.locked){
      const j=findStart(exp,ses.pos,H,i,thr);
      if(j<0){if(i>=H.length-1){ses.pend=[H[i]];break}i++;continue}
      ses.pos=j;ses.locked=true;
    }
    const h=H[i],pos=ses.pos;
    const m0=matchWord(exp[pos],h,thr);
    if(m0.k){mark(exp[pos],m0.k,h.raw);ses.pos=pos+1;i++;continue}
    // un mot attendu entendu en deux morceaux
    if(i+1<H.length){
      const mm=matchWord(exp[pos],joined(h,H[i+1]),thr);
      if(mm.k&&mm.s>=.85){mark(exp[pos],'ok',h.raw+' '+H[i+1].raw);ses.pos=pos+1;i+=2;continue}
    }
    // deux mots attendus entendus en un seul
    if(pos+1<exp.length){
      const mm=matchWord(joined(exp[pos],exp[pos+1]),h,thr);
      if(mm.k&&mm.s>=.85){mark(exp[pos],'ok',h.raw);mark(exp[pos+1],'ok',h.raw);ses.pos=pos+2;i++;continue}
    }
    // mots sautés (jusqu'à 3)
    let best=-1,bs=0;
    for(let k=1;k<=3&&pos+k<exp.length;k++){
      const m=matchWord(exp[pos+k],h,thr);
      if(m.k==='ok'&&exp[pos+k].sk.length>=(k===1?2:3)&&m.s-k*.04>bs){best=k;bs=m.s-k*.04}
    }
    if(best>0){
      for(let j=0;j<best;j++){exp[pos+j].status=exp[pos+j].n.length<=2?'approx':'skip';exp[pos+j].heard=''}
      mark(exp[pos+best],'ok',h.raw);ses.pos=pos+best+1;i++;continue;
    }
    // correction d'une faute récente
    let fixed=false;
    for(let k=1;k<=3&&pos-k>=0;k++){
      const w=exp[pos-k];
      if((w.status==='bad'||w.status==='skip')&&matchWord(w,h,thr).k){w.status='ok';w.heard=h.raw;w.fixed=true;fixed=true;break}
    }
    if(fixed){i++;continue}
    // répétition d'un mot déjà dit
    let rep=false;
    for(let k=1;k<=2&&pos-k>=0;k++){if(matchWord(exp[pos-k],h,thr).k)rep=true}
    if(rep){i++;continue}
    mark(exp[pos],'bad',h.raw);ses.pos=pos+1;i++;
  }
  if(ses.pos>=exp.length)ses.done=true;
}
//</engine>

/* ------------------------------------------------------------------ réglages */
const DEF={theme:'auto',scale:1,sens:'normal',hifz:'off',reciter:'Alafasy_128kbps',speed:1,repeat:1,font:'amiri',layout:'auto',engine:'model',modelId:'omartariq612/tarteel-ai-whisper-tiny-ar-quran-onnx',api:'https://api.quran.com/api/v4'};
let C=Object.assign({},DEF,LS.get('cfg',{}));
const saveC=()=>LS.set('cfg',C);
const THR={strict:.85,normal:.72,lenient:.6};
const FONTS={amiri:"'Amiri Quran'",sch:"'Scheherazade New'",naskh:"'Noto Naskh Arabic'"};
function applyTheme(){
  const r=document.documentElement;
  if(C.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',C.theme);
  r.style.setProperty('--ar',(FONTS[C.font]||FONTS.amiri)+",'Amiri Quran','Scheherazade New','Noto Naskh Arabic',serif");
}
applyTheme();
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3500)}

/* ------------------------------------------------------------------ données */
const mem=new Map();let _db=null;
function idb(){
  if(_db)return _db;
  _db=new Promise((res,rej)=>{try{const r=indexedDB.open('tilawa',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('pages');
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
  return _db;
}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction('pages').objectStore('pages').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return undefined}}
async function idbPut(k,v){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('pages','readwrite');t.objectStore('pages').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
async function idbClear(){try{const db=await idb();await new Promise(res=>{const t=db.transaction('pages','readwrite');t.objectStore('pages').clear();t.oncomplete=res})}catch(e){}mem.clear()}
async function fj(url,tries=4){
  let last;
  for(let i=0;i<tries;i++){
    try{const r=await fetch(url);
      if(r.status===429){await sleep(1500*(i+1));continue}
      if(!r.ok)throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){last=e;await sleep(500*(i+1))}
  }
  throw last||new Error('réseau');
}
let CH=[];
async function loadChapters(){
  CH=LS.get('chapters',[]);
  if(CH.length===114)return;
  const j=await fj(C.api+'/chapters?language=fr');
  CH=j.chapters.map(c=>({id:c.id,name:c.name_simple,ar:c.name_arabic,n:c.verses_count,pages:c.pages}));

}
function parsePage(j,p){
  return {page:p,verses:j.verses.map(v=>({key:v.verse_key,juz:v.juz_number,
    words:v.words.map(w=>({p:w.position,t:w.text_uthmani||w.text||'',l:w.line_number||0,ty:w.char_type_name||'word'}))}))};
}
async function getPage(p){
  if(mem.has(p))return mem.get(p);
  let d=await idbGet(p);
  if(!d){
    const q=`words=true&word_fields=text_uthmani,line_number,page_number&per_page=50`;
    let j=await fj(`${C.api}/verses/by_page/${p}?${q}`);
    d=parsePage(j,p);
    let nx=j.pagination&&j.pagination.next_page;
    while(nx){const j2=await fj(`${C.api}/verses/by_page/${p}?${q}&page=${nx}`);
      d.verses.push(...parsePage(j2,p).verses);nx=j2.pagination&&j2.pagination.next_page}
    await idbPut(p,d);
  }
  mem.set(p,d);return d;
}

function hashStr(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
const newSes=(o={})=>Object.assign({pos:0,done:false,locked:false,pend:[],carry:[]},o);

function isFlow(){return C.layout==='flow'||(C.layout!=='mushaf'&&innerWidth<700)}
function fit(){
  const sheet=$('#sheet'),box=$('#lines');
  if(!sheet||!box||!box.children.length||!sheet.offsetParent)return;
  const flow=isFlow();box.classList.toggle('flow',flow);
  const cs=getComputedStyle(sheet),avail=sheet.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  if(flow){sheet.style.setProperty('--fs',(Math.max(20,Math.min(38,avail/12.5))*C.scale).toFixed(1)+'px');return}
  sheet.style.setProperty('--fs','30px');
  let need=0;
  for(const L of box.querySelectorAll('.ln:not(.short)')){
    let w=0;for(const c of L.children)w+=c.getBoundingClientRect().width;need=Math.max(need,w);
  }
  const fs=need?Math.max(12,Math.min(46,30*avail/need*.985)):26;
  sheet.style.setProperty('--fs',(fs*Math.min(1,C.scale)).toFixed(1)+'px');
}

async function showPage(p,opts={}){
  p=Math.min(604,Math.max(1,p|0));
  S.page=p;LS.set('page',p);$('#pageIn').value=p;
  $('#lines').innerHTML='<div class="muted" style="direction:ltr;padding:24px 0;text-align:center;font-family:var(--ui);font-size:15px">Chargement…</div>';
  let d;
  try{d=await getPage(p);if(!S.bism){try{const d1=await getPage(1);S.bism=d1.verses[0].words.filter(w=>w.ty==='word').map(w=>w.t).join(' ')}catch(e){}}}
  catch(e){$('#lines').innerHTML=`<div class="err" style="direction:ltr;padding:20px;font-family:var(--ui);font-size:15px">Impossible de charger la page ${p} (${esc(e.message)}). Vérifie ta connexion ou l'adresse de l'API dans les réglages.<br><br><button class="btn" id="retry">Réessayer</button></div>`;
    $('#retry').onclick=()=>showPage(p);return}
  if(S.page!==p)return;
  PW=[];const lines=[];let cur=null;
  for(const v of d.verses){
    const [c,n]=v.key.split(':').map(Number);
    const first=v.words.find(w=>w.ty==='word');
    for(const w of v.words){
      if(!cur||cur.n!==w.l){cur={n:w.l,items:[],head:null};lines.push(cur)}
      if(n===1&&first&&w.p===first.p&&w.ty==='word')cur.head=c;
      if(w.ty==='word'){
        const idx=PW.length;
        const pr=prep(w.t);
        const hid=C.hifz==='all'||(C.hifz==='first'&&w.p!==first.p)||(C.hifz==='half'&&w.p!==first.p&&hashStr(v.key+w.p)%2===0);
        PW.push({key:v.key,pos:w.p,t:w.t,n:pr.n,sk:pr.sk,status:null,heard:'',hid:!!hid,rev:false});
        cur.items.push(`<span class="w" data-i="${idx}">${esc(w.t)}</span>`);
      }else if(w.ty==='end'){cur.items.push(`<span class="end" data-k="${v.key}">${esc(w.t)}</span>`)}
      else cur.items.push(`<span class="mk">${esc(w.t)}</span>`);
    }
  }
  const html=lines.map(L=>{
    let h='';
    if(L.head){const ch=CH[L.head-1];
      h+=`<div class="sura">سورة ${esc(ch?ch.ar:'')}</div>`;
      if(L.head!==1&&L.head!==9&&S.bism)h+=`<div class="bism">${esc(S.bism)}</div>`;}
    const short=L.items.length<4&&lines.length>1;
    return h+`<div class="ln${short?' short':''}">${L.items.join(' ')}</div>`;
  }).join('');
  $('#lines').innerHTML=html;
  const juz=d.verses[0]&&d.verses[0].juz;
  const ch0=d.verses[0]?+d.verses[0].key.split(':')[0]:1;
  $('#shJuz').textContent=juz?`الجزء ${ar(juz)}`:'';
  $('#shSura').textContent=CH[ch0-1]?`سورة ${CH[ch0-1].ar}`:'';
  $('#pgno').textContent=ar(p);
  $('#selSura').value=String(ch0);
  S.ses=newSes({pos:opts.start||0,locked:!!opts.start});
  if(opts.start)for(let i=0;i<opts.start;i++)PW[i].status='na';
  fit();paint();
}

function paint(){
  const spans=$$('#lines .w');
  for(const sp of spans){
    const i=+sp.dataset.i,w=PW[i];if(!w)continue;
    let c='w';
    if(w.status)c+=' '+w.status;
    if(w.hid&&!w.rev&&w.status!=='ok'&&w.status!=='approx')c+=' hid';
    if(S.listening&&S.ses&&S.ses.locked&&S.ses.pos===i)c+=' cur';
    sp.className=c;
  }
  const cnt={ok:0,approx:0,bad:0,skip:0};
  for(const w of PW)if(cnt[w.status]!==undefined)cnt[w.status]++;
  const tot=cnt.ok+cnt.approx+cnt.bad+cnt.skip;
  $('#stat').innerHTML=tot?`<span><b>${tot}</b> mots suivis</span><span><b>${Math.round(100*(cnt.ok+cnt.approx)/tot)}%</b> corrects</span><span><b>${cnt.bad}</b> erreurs</span><span><b>${cnt.skip}</b> oubliés</span>`:'';
  const cur=$('#lines .w.cur');
  if(cur){const r=cur.getBoundingClientRect();if(r.top<150||r.bottom>innerHeight-170)cur.scrollIntoView({block:'center',behavior:'smooth'})}
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
let micOK=false,evCount=0,watch=null,prog={},hideT=null;
function setDiag(t){$('#diag').textContent=t||''}
function setMsg(){
  const m=$('#msgMain');
  if(S.listening)m.innerHTML=S.ses&&S.ses.locked?'<b>J’écoute…</b> suis la flèche dorée.':'<b>J’écoute…</b> commence à réciter, je trouve l’endroit.';
  else m.textContent='Touche le micro et récite, depuis n’importe quel mot de la page.';
}
async function primeMic(){
  if(micOK)return true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return true;
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop());micOK=true;await sleep(250);return true}
  catch(e){
    if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError')){
      setDiag('Micro refusé. Autorise-le : touche « aA » dans la barre d’adresse, Réglages du site web, Micro.');return false}
    return true;
  }
}
function newRun(){return {ok:0,approx:0,bad:0,skip:0,errs:[],pages:new Set(),t0:Date.now()}}
function foldPage(){
  if(!S.run)return;
  S.run.pages.add(S.page);
  const byV={};
  PW.forEach(w=>{(byV[w.key]=byV[w.key]||[]).push(w)});
  const srs=LS.get('srs',{}),weak=LS.get('weak',{});
  const DAY=864e5,IV=[1,3,7,14,30,60];
  for(const w of PW){
    if(w.status==='ok'||w.status==='approx')S.run[w.status]++;
    else if(w.status==='bad'||w.status==='skip'){
      S.run[w.status]++;
      S.run.errs.push({key:w.key,pos:w.pos,t:w.t,heard:w.heard,kind:w.status});
      const k=w.key+':'+w.pos;weak[k]=weak[k]||{n:0,t:w.t};weak[k].n++;
    }
  }
  for(const [key,ws] of Object.entries(byV)){
    if(ws.some(w=>!w.status||w.status==='na'))continue;
    const bad=ws.some(w=>w.status==='bad'||w.status==='skip');
    const e=srs[key]||{box:0,due:0};
    e.box=bad?0:Math.min(5,e.box+1);e.due=Date.now()+IV[e.box]*DAY;e.page=S.page;srs[key]=e;
  }
  LS.set('srs',srs);LS.set('weak',weak);
}
async function startListening(){
  if(S.listening)return;
  if(engine()==='model')return startModel();
  if(!SR){toast('La reconnaissance vocale n’est pas disponible ici. Utilise Safari, Chrome ou Edge.');
    setDiag('Ce navigateur ne propose pas la reconnaissance vocale.');return}
  S.listening=true;
  $('#mic').classList.add('live');$('#mic').setAttribute('aria-label','Arrêter la récitation');
  $('#msgMain').innerHTML='<b>Autorisation du micro…</b>';setDiag('');
  const ok=await primeMic();
  if(!S.listening)return;
  if(!ok){S.listening=false;$('#mic').classList.remove('live');setMsg();return}
  S.run=S.run||newRun();
  if(!S.ses||S.ses.done){PW.forEach(w=>{w.status=null;w.heard='';w.rev=false});S.ses=newSes()}
  evCount=0;prog={};
  clearTimeout(watch);
  watch=setTimeout(()=>{if(S.listening&&!evCount)setDiag(
    'Aucune voix reçue. Vérifie que la dictée est activée (Réglages > Général > Clavier)'+(STANDALONE?' et ouvre l’app dans Safari, pas depuis l’écran d’accueil.':'.'))},7000);
  setMsg();paint();
  const r=ensureRec();
  try{r.start()}catch(e){}
}
function ensureRec(){
  if(S.rec)return S.rec;
  const r=new SR();
  r.lang='ar-SA';r.continuous=!IOS;r.interimResults=true;r.maxAlternatives=3;
  r.onstart=()=>{prog={};setDiag('Micro ouvert. Récite.')};
  r.onspeechstart=()=>setDiag('Voix détectée.');
  r.onresult=onResult;
  r.onerror=onErr;
  r.onend=()=>{if(S.listening)setTimeout(()=>{if(S.listening){try{r.start()}catch(e){}}},IOS?250:120)};
  S.rec=r;return r;
}
function onResult(e){
  evCount++;clearTimeout(watch);
  const thr=THR[C.sens];let shown='';
  for(let i=e.resultIndex;i<e.results.length;i++){
    const res=e.results[i];
    const alts=[];for(let a=0;a<res.length;a++)alts.push(((res[a]&&res[a].transcript)||'').trim());
    const p=prog[i]||(prog[i]={done:0,prev:[]});
    if(res.isFinal){
      const text=C.sens==='strict'?alts[0]:pickAlt(PW,S.ses,alts,thr);
      feed(PW,S.ses,text.split(/\s+/).filter(Boolean).slice(p.done),thr);
      delete prog[i];shown=text;
    }else{
      const words=(alts[0]||'').split(/\s+/).filter(Boolean);
      let st=0;while(st<words.length&&st<p.prev.length&&words[st]===p.prev[st])st++;
      st=Math.min(st,words.length-1);
      if(st>p.done){feed(PW,S.ses,words.slice(p.done,st),thr);p.done=st}
      p.prev=words;shown=alts[0]||'';
    }
  }
  $('#heard').textContent=shown;
  clearTimeout(hideT);hideT=setTimeout(()=>{$('#heard').textContent=''},2500);
  setMsg();paint();
  if(S.ses&&S.ses.done)onPageDone();
}
function onErr(e){
  const c=e.error;
  if(c==='no-speech'||c==='aborted')return;
  const T={
    'not-allowed':'Micro refusé pour ce site. Touche « aA » dans la barre d’adresse, puis Réglages du site web, Micro.',
    'service-not-allowed':'Reconnaissance vocale bloquée. Active la dictée (Réglages > Général > Clavier) et ouvre l’app dans Safari, pas depuis l’écran d’accueil.',
    'audio-capture':'Aucun micro détecté.',
    'network':'La reconnaissance vocale a besoin d’Internet.',
    'language-not-supported':'L’arabe n’est pas pris en charge par la reconnaissance vocale de cet appareil.'};
  setDiag(T[c]||('Erreur micro : '+c));
  if(c==='not-allowed'||c==='service-not-allowed'||c==='language-not-supported'||c==='audio-capture')stopListening(true,true);
}
async function onPageDone(){
  if(S.turning)return;S.turning=true;
  try{
    const old=S.ses;
    foldPage();
    if(S.page<604&&S.listening){
      await showPage(S.page+1);
      const carry=old.carry||[];
      S.ses.locked=true;
      if(carry.length)feed(PW,S.ses,carry,THR[C.sens]);
      setMsg();paint();
    }else stopListening(false);
  }finally{S.turning=false}
}
function stopListening(silent,keepDiag){
  const was=S.listening;S.listening=false;
  clearTimeout(watch);
  try{S.rec&&S.rec.abort()}catch(e){}
  stopCapture();A.queue=[];
  const dg=$('#dbg');if(dg)dg.textContent='';
  $('#mic').style.removeProperty('--lvl');$('#mic').classList.remove('lvl');
  $('#mic').classList.remove('live');$('#mic').setAttribute('aria-label','Commencer la récitation');
  $('#heard').textContent='';
  if(!keepDiag)setDiag('');
  if(was&&S.run){
    const attended=PW.some(w=>w.status&&w.status!=='na');
    if(attended&&!(S.ses&&S.ses.done&&S.run.pages.has(S.page)))foldPage();
    if(!silent&&(S.run.ok+S.run.approx+S.run.bad+S.run.skip)>0)showSummary();
    S.run=null;
  }
  setMsg();paint();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.listening)stopListening(true)});
function showSummary(){
  const r=S.run,tot=r.ok+r.approx+r.bad+r.skip,acc=tot?Math.round(100*(r.ok+r.approx)/tot):0;
  const items=r.errs.slice(0,60).map(e=>`<li><span class="ar">${esc(e.t)}</span><span class="small muted">${e.key} · ${e.kind==='bad'?'entendu « '+esc(e.heard||'—')+' »':'oublié'}</span></li>`).join('');
  const hist=LS.get('hist',[]);hist.unshift({t:Date.now(),acc,tot,bad:r.bad,skip:r.skip,pages:[...r.pages]});
  LS.set('hist',hist.slice(0,60));

    <p style="font-size:1.6rem;margin:.2em 0"><b>${acc}%</b> <span class="muted small">sur ${tot} mots</span></p>
    <p class="small muted">${r.bad} erreurs · ${r.skip} mots oubliés · ${r.approx} à vérifier</p>
    ${items?`<ul class="list" style="max-height:40vh;overflow:auto">${items}</ul>`:'<p class="ok-t">Aucune erreur détectée.</p>'}
    <p class="small muted">La reconnaissance vocale peut se tromper : touche un mot rouge pour le valider à la main.</p>
    <div class="row"><button class="btn" id="sumClose">Fermer</button></div>`;
  $('#sum').showModal();$('#sumClose').onclick=()=>$('#sum').close();
}

const engine=()=>C.engine==='browser'?'browser':'model';
const MODEL_VERS=['3.5.1','3.5.0','3.3.3','3.2.4'];
const WORKER_SRC=[
"const VERS="+JSON.stringify(MODEL_VERS)+";",
"let T=null,asr=null;const fl={};",
"function pct(){let l=0,t=0;for(const k in fl){l+=fl[k].l;t+=fl[k].t}return t?Math.round(100*l/t):0}",
"self.onmessage=async e=>{",
" const m=e.data;",
" try{",
"  if(m.type==='load'){",
"   for(const v of VERS){try{T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@'+v);break}catch(err){}}",
"   if(!T)throw new Error('bibliothèque introuvable');",
"   T.env.allowLocalModels=false;",
"   asr=await T.pipeline('automatic-speech-recognition',m.model,{dtype:{encoder_model:'q8',decoder_model_merged:'q8'},progress_callback:p=>{",
"    if(p&&p.file&&p.total){fl[p.file]={l:p.loaded||0,t:p.total};self.postMessage({type:'progress',pct:pct()})}}});",
"   self.postMessage({type:'ready'});",
"  }else if(m.type==='run'){",
"   let o=await asr(m.audio,{language:'arabic',task:'transcribe'});",
"   let t=(o&&o.text)||'',mode=1;",
"   if(!t.trim()){o=await asr(m.audio);t=(o&&o.text)||'';mode=2}",
"   self.postMessage({type:'text',id:m.id,text:t,mode:mode});",
"  }",
" }catch(err){self.postMessage({type:'error',id:m.id,message:String((err&&err.message)||err)})}",
"};"
].join('\n');
const M={w:null,state:'idle',pending:new Map(),id:0,pct:0,loading:null,onp:null};
function modelWorker(){
  if(M.w)return M.w;
  const w=new Worker(URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})),{type:'module'});
  w.onmessage=e=>{
    const m=e.data;
    if(m.type==='progress'){M.pct=m.pct;if(M.state==='loading')setDiag(`Téléchargement du modèle Coran… ${m.pct}%`);if(M.onp)M.onp(m.pct)}
    else if(m.type==='ready'){M.state='ready';if(M.res)M.res()}
    else if(m.type==='text'){M.mode=m.mode;const p=M.pending.get(m.id);M.pending.delete(m.id);if(p)p.res(m.text)}
    else if(m.type==='error'){
      if(M.state==='loading'){M.state='idle';if(M.rej)M.rej(new Error(m.message))}
      else{const p=M.pending.get(m.id);M.pending.delete(m.id);if(p)p.rej(new Error(m.message))}
    }
  };
  w.onerror=ev=>{if(M.state==='loading'&&M.rej)M.rej(new Error(ev.message||'worker'))};
  M.w=w;return w;
}
function loadModel(){
  if(M.state==='ready')return Promise.resolve();
  if(M.loading)return M.loading;
  M.state='loading';
  M.loading=new Promise((res,rej)=>{M.res=res;M.rej=rej;modelWorker().postMessage({type:'load',model:C.modelId})})
    .catch(e=>{try{M.w&&M.w.terminate()}catch(x){}M.w=null;M.state='idle';throw e})
    .finally(()=>{M.loading=null});
  return M.loading;
}
function transcribe(f32){
  return new Promise((res,rej)=>{const id=++M.id;M.pending.set(id,{res,rej});M.w.postMessage({type:'run',id,audio:f32},[f32.buffer])});
}

const A={ac:null,stream:null,node:null,src:null,pre:[],seg:[],segLen:0,voice:0,sil:0,noise:.008,active:false,busy:false,queue:[],draining:false,hist:[],sent:0,got:0,ms:0,tick:0,rms:0};
function resample(x,from,to){
  if(from===to)return x;
  const r=from/to,n=Math.floor(x.length/r),out=new Float32Array(n);
  for(let i=0;i<n;i++){const a=Math.floor(i*r),b=Math.min(x.length,Math.floor((i+1)*r));let s=0;for(let j=a;j<b;j++)s+=x[j];out[i]=b>a?s/(b-a):0}
  return out;
}
async function startAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!A.ac)A.ac=new AC();
  try{A.ac.resume()}catch(e){}
  A.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:true}});
  await Promise.race([A.ac.resume(),sleep(1500)]);
  A.src=A.ac.createMediaStreamSource(A.stream);
  A.node=A.ac.createScriptProcessor(4096,1,1);
  A.node.onaudioprocess=ev=>onAudio(new Float32Array(ev.inputBuffer.getChannelData(0)));
  A.src.connect(A.node);A.node.connect(A.ac.destination);
  Object.assign(A,{seg:[],pre:[],segLen:0,voice:0,sil:0,active:false,noise:.008,draining:false,queue:[],hist:[],sent:0,got:0,ms:0,tick:0,rms:0});
}
function stopCapture(){
  try{if(A.node){A.node.onaudioprocess=null;A.node.disconnect()}}catch(e){}
  try{A.src&&A.src.disconnect()}catch(e){}
  try{A.stream&&A.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{A.ac&&A.ac.close()}catch(e){}
  A.ac=A.stream=A.node=A.src=null;A.active=false;A.seg=[];A.pre=[];
}
function onAudio(x){
  if(!S.listening||engine()!=='model'||!A.ac||A.draining)return;
  const sr=A.ac.sampleRate,dur=x.length/sr*1000;
  let s=0;for(let i=0;i<x.length;i+=2)s+=x[i]*x[i];
  const rms=Math.sqrt(s/(x.length/2));A.rms=rms;
  $('#mic').style.setProperty('--lvl',Math.min(1,rms*14).toFixed(2));
  A.hist.push(rms);if(A.hist.length>60)A.hist.shift();
  const srt=[...A.hist].sort((a,b)=>a-b);
  A.noise=Math.min(.006,srt[Math.floor(srt.length*.15)]);
  const thr=Math.max(.005,A.noise*2.6);A.thr=thr;
  const loud=rms>thr;
  if(loud){
    if(!A.active){A.active=true;A.seg=A.pre.slice();A.segLen=A.seg.reduce((n,c)=>n+c.length,0);A.voice=0}
    A.voice+=dur;A.sil=0;
  }
  if(A.active){A.seg.push(x);A.segLen+=x.length;if(!loud)A.sil+=dur}
  else{A.pre.push(x);if(A.pre.length>4)A.pre.shift()}
  const segMs=A.segLen/sr*1000;
  if(A.active&&(A.sil>=600||(segMs>=6000&&!loud)||segMs>=10000))flushSeg();
  const now=Date.now();
  if(now-A.tick>400){A.tick=now;showDbg(rms,thr)}
}
function showDbg(rms,thr){
  const e=$('#dbg');if(!e)return;
  e.textContent=`niveau ${(rms*100).toFixed(1)} · seuil ${(thr*100).toFixed(1)} · envoyés ${A.sent} · reçus ${A.got}${A.ms?' · '+(A.ms/1000).toFixed(1)+' s':''}${A.got?` · passage ${(A.lastDur||0).toFixed(1)} s, pic ${Math.round((A.lastPk||0)*100)}% · texte ${A.last?A.last.length+' car.':'vide'} · essai ${A.mode||1}`:''}`;
}
function flushSeg(){
  if(!A.ac)return;
  const sr=A.ac.sampleRate,total=A.seg.reduce((n,c)=>n+c.length,0),all=new Float32Array(total);
  let o=0;for(const c of A.seg){all.set(c,o);o+=c.length}
  const voiced=A.voice;
  A.seg=[];A.segLen=0;A.active=false;A.voice=0;A.sil=0;A.pre=[];
  if(voiced<350)return;
  const f=resample(all,sr,16000);
  let pk=0;for(let i=0;i<f.length;i++){const v=Math.abs(f[i]);if(v>pk)pk=v}
  A.lastDur=f.length/16000;A.lastPk=pk;
  if(pk>0&&pk<.5){const g=.7/pk;for(let i=0;i<f.length;i++)f[i]*=g}
  A.sent++;A.queue.push(f);if(A.queue.length>3)A.queue.shift();
  pump();
}
async function pump(){
  if(A.busy)return;A.busy=true;
  try{
    while(A.queue.length&&S.listening){
      const f=A.queue.shift();
      $('#heard').textContent='…';
      let text='';const t0=Date.now();
      setDiag(A.got?'Analyse…':'Analyse… le premier passage est lent, patiente.');
      try{text=await transcribe(f)}catch(e){setDiag('Erreur du modèle : '+e.message);continue}
      A.ms=Date.now()-t0;A.got++;showDbg(A.rms,A.thr||0);
      if(!S.listening)break;
      text=(text||'').trim();A.last=text;A.mode=M.mode;showDbg(A.rms,A.thr||0);
      if(normalize(text).length<2){
        $('#heard').textContent=text?('« '+text+' »'):'(le modèle n’a rien compris)';
        setDiag(text?'Le modèle a répondu sans texte arabe.':'Le modèle n’a rien reconnu dans ce passage.');
        clearTimeout(hideT);hideT=setTimeout(()=>{$('#heard').textContent=''},4000);continue;
      }
      if(normalize(text).length>=2){
        evCount++;
        feed(PW,S.ses,text.split(/\s+/).filter(Boolean),THR[C.sens]);
        $('#heard').textContent=text;clearTimeout(hideT);hideT=setTimeout(()=>{$('#heard').textContent=''},4000);
        setMsg();paint();
        if(S.ses&&S.ses.done)onPageDone();
      }
      setDiag(A.queue.length?'Analyse…':'Prêt. Continue, fais une courte pause entre les versets.');
    }
  }finally{A.busy=false}
}
async function drainModel(){
  A.draining=true;
  if(A.active)flushSeg();
  const t0=Date.now();
  while((A.busy||A.queue.length)&&Date.now()-t0<15000){$('#msgMain').innerHTML='<b>Analyse finale…</b>';await sleep(200)}
}
async function startModel(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&(window.AudioContext||window.webkitAudioContext)&&window.Worker)){
    setDiag('Ce navigateur ne permet pas le modèle Coran. Choisis « reconnaissance de Safari ».');return}
  S.listening=true;
  if(!A.ac){try{A.ac=new (window.AudioContext||window.webkitAudioContext)();A.ac.resume()}catch(e){}}
  const off=()=>{try{A.ac&&A.ac.close()}catch(x){}A.ac=null;S.listening=false;$('#mic').classList.remove('live','lvl');$('#mic').setAttribute('aria-label','Commencer la récitation');setMsg()};
  $('#mic').classList.add('live','lvl');$('#mic').setAttribute('aria-label','Arrêter la récitation');
  try{
    if(M.state!=='ready'){
      if(!LS.get('modelOk',false)){
        const r=await askDownload();
        if(r==='browser'){off();C.engine='browser';saveC();updEng();return startListening()}
        if(r!=='go'){off();return}
      }
      $('#msgMain').innerHTML='<b>Chargement du modèle Coran…</b>';setDiag('Téléchargement du modèle Coran… 0%');
      await loadModel();LS.set('modelOk',true);
    }
    if(!S.listening)return;
    $('#msgMain').innerHTML='<b>Autorisation du micro…</b>';
    await startAudio();
  }catch(e){
    off();stopCapture();
    const n=e&&e.name;
    setDiag(n==='NotAllowedError'||n==='SecurityError'
      ?'Micro refusé. Touche « aA » dans la barre d’adresse, Réglages du site web, Micro.'
      :'Impossible de démarrer le modèle Coran : '+((e&&e.message)||e)+'. Tu peux choisir « reconnaissance de Safari ».');
    return;
  }
  if(!S.listening){stopCapture();return}
  S.run=S.run||newRun();
  if(!S.ses||S.ses.done){PW.forEach(w=>{w.status=null;w.heard='';w.rev=false});S.ses=newSes()}
  evCount=0;setMsg();paint();
  setDiag('Prêt. Récite, fais une courte pause entre les versets.');
}

async function verifyAll(){
  const errs=[];const seen=new Map();let words=0,pages=0;
  for(let p=1;p<=604;p++){
    const d=await idbGet(p)||mem.get(p);
    if(!d){errs.push(`Page ${p} manquante`);continue}
    pages++;
    for(const v of d.verses){
      const [c,n]=v.key.split(':').map(Number);
      if(!seen.has(c))seen.set(c,new Set());seen.get(c).add(n);
      const rw=v.words.filter(w=>w.ty==='word');
      if(!rw.length)errs.push(`${v.key} : aucun mot`);
      rw.forEach((w,i)=>{words++;if(!w.t)errs.push(`${v.key}:${w.p} : mot vide`);if(w.p!==i+1)errs.push(`${v.key} : positions non continues`)});
    }
  }
  let verses=0;
  for(const ch of CH){
    const s=seen.get(ch.id);const got=s?s.size:0;verses+=got;
    if(got!==ch.n)errs.push(`Sourate ${ch.id} : ${got}/${ch.n} versets`);
    else for(let i=1;i<=ch.n;i++)if(!s.has(i)){errs.push(`Sourate ${ch.id} : verset ${i} absent`);break}
  }
  if(CH.length!==114)errs.push(`${CH.length}/114 sourates`);
  if(verses!==6236)errs.push(`${verses}/6236 versets`);
  const rep={ok:!errs.length,pages,verses,words,errs:errs.slice(0,30),date:Date.now()};
  LS.set('integrity',rep);return rep;
}
async function downloadAll(onP){
  let done=0,fail=0;const todo=[];
  for(let p=1;p<=604;p++)todo.push(p);
  const worker=async()=>{
    while(todo.length){
      const p=todo.shift();
      try{if(!(await idbGet(p)))await getPage(p);}catch(e){fail++}
      done++;onP(done,fail);
    }
  };
  await Promise.all([worker(),worker(),worker()]);
  return fail;
}
async function sha(s){
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tilawa:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0;return 'x'+h;
}

    b.disabled=true;M.onp=p=>{b.textContent=`Téléchargement… ${p}%`};b.textContent='Téléchargement… 0%';
    try{await loadModel();LS.set('modelOk',true);b.textContent='Modèle prêt'}
    catch(e){b.textContent='Échec : réessayer';toast('Échec : '+e.message)}
    M.onp=null;b.disabled=false;
  };
  bind('#cHifz',e=>{C.hifz=e.value;showPage(S.page)});
  bind('#cLay',e=>{C.layout=e.value});
  bind('#cFont',e=>{C.font=e.value;applyTheme();setTimeout(fit,300)});
  bind('#cRec',e=>C.reciter=e.value);bind('#cSpd',e=>{C.speed=+e.value;AUD.playbackRate=C.speed});bind('#cRep',e=>C.repeat=+e.value);
  bind('#cTh',e=>{C.theme=e.value;applyTheme()});
  $('#cSc').oninput=e=>{C.scale=+e.target.value;saveC()};
  bind('#cApi',e=>{C.api=e.value.trim().replace(/\/$/,'')||DEF.api;idbClear();LS.set('chapters',[]);toast('Adresse enregistrée. Les pages seront rechargées.')});
  const showIg=r=>{$('#igBox').innerHTML=`<p class="${r.ok?'ok-t':'err'}"><b>${r.ok?'Contrôle réussi':'Contrôle échoué'}</b> : ${r.pages}/604 pages, ${r.verses}/6236 versets, ${r.words} mots.${r.errs.length?'<br>'+r.errs.map(esc).join('<br>'):''}</p>`};
  $('#chk').onclick=async()=>{await loadChapters().catch(()=>{});showIg(await verifyAll())};
  $('#dlAll').onclick=async()=>{
    const pr=$('#dlP');pr.hidden=false;$('#dlAll').disabled=true;
    try{await loadChapters();const f=await downloadAll((d,f)=>{pr.value=d;$('#dlAll').textContent=`${d}/604${f?` (${f} échecs)`:''}`});
      const r=await verifyAll();showIg(r);if(f)toast(`${f} pages n’ont pas pu être chargées : relance le téléchargement.`)}
    catch(e){toast('Échec : '+e.message)}
    $('#dlAll').disabled=false;$('#dlAll').textContent='Télécharger tout et vérifier';
  };
  $('#pinSet').onclick=async()=>{const v=$('#pin1').value.trim();if(v.length<4){toast('4 chiffres minimum');return}LS.set('pin',await sha(v));toast('Code enregistré');renderSettings()};
  const po=$('#pinOff');if(po)po.onclick=()=>{try{localStorage.removeItem('tilawa.pin')}catch(e){}toast('Code retiré');renderSettings()};
  $('#exp').onclick=()=>{
    const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('tilawa.')&&k!=='tilawa.chapters'&&k!=='tilawa.pin')o[k]=localStorage.getItem(k)}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='tilawa-sauvegarde.json';a.click();
  };
  $('#imp').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());for(const [k,v] of Object.entries(o))if(k.startsWith('tilawa.')&&k!=='tilawa.pin')localStorage.setItem(k,v);C=Object.assign({},DEF,LS.get('cfg',{}));applyTheme();toast('Données importées');renderSettings()}catch(err){toast('Fichier invalide')}};
  $('#wipe').onclick=()=>{if($('#wipe').dataset.sure){try{localStorage.clear()}catch(e){}idbClear().then(()=>location.reload())}else{$('#wipe').dataset.sure=1;$('#wipe').textContent='Confirmer : tout effacer'}};
}

/* ------------------------------------------------------------------ démarrage */
async function boot(){
  try{await loadChapters()}catch(e){
    $('#lines').innerHTML=`<div class="err" style="direction:ltr;padding:20px;font-family:var(--ui);font-size:15px">Impossible de joindre l’API du Coran (${esc(e.message)}). Connecte-toi à Internet pour le premier lancement.<br><br><button class="btn" id="retry">Réessayer</button></div>`;
    $('#retry').onclick=boot;return;
  }
  $('#selSura').innerHTML=CH.map(c=>`<option value="${c.id}">${c.id}. ${esc(c.name)} — ${esc(c.ar)}</option>`).join('');
  showPage(S.page);
}
async function unlockThenBoot(){
  const pin=LS.get('pin',null);
  if(!pin){boot();return}
  $('#lock').hidden=false;$('#pinIn').focus();
  $('#lockForm').onsubmit=async e=>{
    e.preventDefault();
    if(await sha($('#pinIn').value)===pin){$('#lock').hidden=true;boot()}
    else{$('#lockErr').textContent='Code incorrect';$('#pinIn').value=''}
  };
}
unlockThenBoot();
})();
</script>
</body>
</html>
